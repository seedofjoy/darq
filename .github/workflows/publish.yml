name: Upload package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/darq
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: python -m pip install --upgrade pip setuptools build twine

    - name: Build package
      run: python -m build

    - name: Twine check
      run: twine check dist/*

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
